<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #071426;
    color: white;
}

header {
    background: #102744;
    padding: 22px;
    text-align: center;
    border-bottom: 2px solid #168cff;
}

header h1 {
    color: #168cff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #102744;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

h2 {
    color: #168cff;
    margin-bottom: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    background: #eaf2ff;
}

button {
    background: #168cff;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #0066cc;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 20px;
}

nav button {
    flex: 1;
}

.item {
    background: #193653;
    padding: 15px;
    margin-top: 12px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.delete {
    background: #dc3545;
}

.edit {
    background: #198754;
}

.section {
    display: none;
}

#loginBox {
    max-width: 450px;
    margin: 60px auto;
}

small {
    color: #aabbd0;
}

#message {
    margin: 12px 0;
    color: #4dffae;
}

.logout {
    background: #dc3545;
}

@media(max-width:600px) {
    nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>
