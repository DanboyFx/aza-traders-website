<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZA TRADERS | Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #071426;
    color: white;
}

header {
    background: #102744;
    padding: 22px;
    text-align: center;
    border-bottom: 2px solid #168cff;
}

header h1 {
    color: #168cff;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

h2 {
    margin: 25px 0 15px;
    color: #168cff;
}

.card {
    background: #102744;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    background: #eaf2ff;
}

button {
    background: #168cff;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    background: #0066cc;
}

.item {
    background: #193653;
    padding: 15px;
    margin-top: 10px;
    border-radius: 7px;
    overflow-wrap: anywhere;
}

.delete {
    background: #dc3545;
}
</style>
</head>

<body>

<header>
<h1>AZA TRADERS</h1>
<p>ADMIN CONTROL PANEL</p>
</header>

<div class="container">

<h2>Welcome, Admin</h2>

<div class="card">
<h3>Website Management</h3>
<p>Manage your AZA TRADERS educational content.</p>
</div>

<div class="card">
<h2>Add New Course</h2>

<input id="courseTitle" placeholder="Course Title">

<textarea id="courseDescription" placeholder="Course Description"></textarea>

<input id="courseLink" placeholder="Course Link">

<button onclick="addCourse()">Add Course</button>

<div id="courseList"></div>
</div>

<div class="card">
<h2>Add Broker</h2>

<input id="brokerName" placeholder="Broker Name">

<input id="brokerLink" placeholder="Registration Link">

<button onclick="addBroker()">Add Broker</button>

<div id="brokerList"></div>
</div>

<div class="card">
<h2>Add Prop Firm</h2>

<input id="propName" placeholder="Prop Firm Name">

<input id="propLink" placeholder="Website Link">

<button onclick="addProp()">Add Prop Firm</button>

<div id="propList"></div>
</div>

</div>

<script>

function saveData(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
}

function getData(key) {
    return JSON.parse(localStorage.getItem(key) || "[]");
}

function addItem(key, values, listId) {
    if (values.some(value => !value.trim())) {
        alert("Please fill in all fields.");
        return;
    }

    const data = getData(key);
    data.push(values);
    saveData(key, data);
    renderItems(key, listId);
}

function renderItems(key, listId) {
    const data = getData(key);
    const list = document.getElementById(listId);

    list.innerHTML = "";

    data.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";

        const title = document.createElement("h3");
        title.textContent = item[0];

        const description = document.createElement("p");
        description.textContent = item[1];

        const link = document.createElement("p");
        link.textContent = item[2] || "";

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "delete";

        del.onclick = function() {
            const updated = getData(key);
            updated.splice(index, 1);
            saveData(key, updated);
            renderItems(key, listId);
        };

        div.append(title, description, link, del);
        list.appendChild(div);
    });
}

function addCourse() {
    addItem("aza_courses", [
        document.getElementById("courseTitle").value,
        document.getElementById("courseDescription").value,
        document.getElementById("courseLink").value
    ], "courseList");
}

function addBroker() {
    addItem("aza_brokers", [
        document.getElementById("brokerName").value,
        document.getElementById("brokerLink").value,
        ""
    ], "brokerList");
}

function addProp() {
    addItem("aza_props", [
        document.getElementById("propName").value,
        document.getElementById("propLink").value,
        ""
    ], "propList");
}

renderItems("aza_courses", "courseList");
renderItems("aza_brokers", "brokerList");
renderItems("aza_props", "propList");

</script>

</body>
 </html>
