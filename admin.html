<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZA TRADERS | Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07111f;
 color:#fff;
}
header{
 background:#0d1b2e;
 padding:22px;
 border-bottom:1px solid #203b59;
}
header h2{color:#35a6ff;margin:0}
header p{color:#a9bad0;font-size:13px}
.container{padding:20px;max-width:900px;margin:auto}
.card{
 background:#0d1b2e;
 border:1px solid #203b59;
 border-radius:12px;
 padding:18px;
 margin-bottom:18px;
}
h3{color:#67d5ff;margin-top:0}
input,textarea,select{
 width:100%;
 padding:13px;
 margin:8px 0 14px;
 background:#07111f;
 color:white;
 border:1px solid #29435f;
 border-radius:7px;
}
textarea{min-height:90px}
button{
 background:#168cff;
 color:white;
 border:0;
 padding:12px 17px;
 border-radius:7px;
 cursor:pointer;
 font-weight:bold;
}
.item{
 background:#10243d;
 padding:13px;
 border-radius:8px;
 margin:10px 0;
 overflow-wrap:anywhere;
}
.item button{margin:5px 5px 0 0}
.delete{background:#b83245}
small{color:#a9bad0}
</style>
</head>

<body>

<header>
<h2>AZA TRADERS</h2>
<p>ADMIN CONTROL PANEL</p>
</header>

<div class="container">

<div class="card">
<h3>Dashboard Overview</h3>
<p>Welcome to your AZA TRADERS Admin Dashboard.</p>
<p>Manage your website content from one place.</p>
</div>

<div class="card">
<h3>Add New Content</h3>

<label>Choose Category</label>
<select id="category">
<option value="Courses">Courses</option>
<option value="Brokers">Brokers</option>
<option value="Prop Firms">Best Prop Firms</option>
<option value="Copy Trading">Copy Trading</option>
<option value="Posts">Website Posts</option>
</select>

<label>Title / Name</label>
<input id="title" placeholder="Enter title or name">

<label>Description</label>
<textarea id="description" placeholder="Write description"></textarea>

<label>Website / Registration / Video Link</label>
<input id="link" type="url" placeholder="https://example.com">

<button onclick="addContent()">Publish Content</button>
</div>

<div class="card">
<h3>Manage Website Content</h3>
<div id="contentList"></div>
</div>

<div class="card">
<h3>Backup</h3>
<p>Download a copy of your saved dashboard content.</p>
<button onclick="backupData()">Download Backup</button>
</div>

</div>

<script>
let contents=JSON.parse(
 localStorage.getItem("azaContents")||"[]"
);

function save(){
 localStorage.setItem(
  "azaContents",
  JSON.stringify(contents)
 );
 display();
}

function addContent(){
 const category=document.getElementById("category").value;
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();
 const link=document.getElementById("link").value.trim();

 if(!title){
  alert("Please enter a title.");
  return;
 }

 contents.unshift({
  id:Date.now(),
  category,
  title,
  description,
  link
 });

 save();

 document.getElementById("title").value="";
 document.getElementById("description").value="";
 document.getElementById("link").value="";

 alert("Content saved in this browser.");
}

function display(){
 const list=document.getElementById("contentList");

 if(contents.length===0){
  list.innerHTML="<p>No content added yet.</p>";
  return;
 }

 list.innerHTML=contents.map(item=>`
  <div class="item">
   <small>${escapeHTML(item.category)}</small>
   <h3>${escapeHTML(item.title)}</h3>
   <p>${escapeHTML(item.description)}</p>
   ${item.link?`<a href="${safeURL(item.link)}" target="_blank" rel="noopener" style="color:#67d5ff">Open Link</a>`:""}
   <br>
   <button onclick="editContent(${item.id})">Edit</button>
   <button class="delete" onclick="deleteContent(${item.id})">Delete</button>
  </div>
 `).join("");
}

function escapeHTML(value){
 return String(value||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function safeURL(value){
 try{
  const url=new URL(value);
  return ["https:","http:"].includes(url.protocol)?escapeHTML(url.href):"#";
 }catch(e){return "#";}
}

function deleteContent(id){
 if(confirm("Are you sure you want to delete this item?")){
  contents=contents.filter(item=>item.id!==id);
  save();
 }
}

function editContent(id){
 const item=contents.find(x=>x.id===id);
 if(!item)return;

 const title=prompt("Edit title:",item.title);
 if(title===null)return;

 const description=prompt("Edit description:",item.description);
 if(description===null)return;

 const link=prompt("Edit link:",item.link);
 if(link===null)return;

 item.title=title.trim();
 item.description=description.trim();
 item.link=link.trim();

 save();
}

function backupData(){
 const file=new Blob(
  [JSON.stringify(contents,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(file);
 const a=document.createElement("a");
 a.href=url;
 a.download="aza-traders-backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

display();
</script>

</body>
  </html>
